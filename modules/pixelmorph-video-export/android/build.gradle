plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pixelmorphvideoexport'
version = '1.0.0'

android {
  namespace "expo.modules.pixelmorphvideoexport"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Same version expo-video already ships, so the app has a single Media3.
  def androidxMedia3Version = "1.9.0"
  implementation "androidx.media3:media3-transformer:${androidxMedia3Version}"
  implementation "androidx.media3:media3-effect:${androidxMedia3Version}"
  implementation "androidx.media3:media3-common:${androidxMedia3Version}"
  // RF-057: HEIC still images on Android 9+ (platform HEVC/HEIC encoder, no codec shipped).
  implementation "androidx.heifwriter:heifwriter:1.0.0"
  // RF-004: finds the main subject on the device. Its model comes through Google Play services.
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  implementation "com.google.android.gms:play-services-base:18.5.0"
}
